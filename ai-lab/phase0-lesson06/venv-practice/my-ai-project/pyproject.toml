[project]
name = "my-ai-project"
version = "0.1.0"
description = "Creation of pyproject.toml with PyTorch and the Anthropic SDK"
readme = "README.md"
authors = [
    { name = "khim", email = "khimgeok_lite@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
torch = ["torch>=2.3"]
llm = ["anthropic>=0.39"]

[project.scripts]
my-ai-project = "my_ai_project:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"